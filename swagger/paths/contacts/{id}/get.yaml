tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieve a contact by its ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: The ID of the contact to retrieve.
    schema:
      type: string
responses:
  '200':
    description: Contact successfully retrieved
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully found contact!"
            data:
              type: object
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: "Contact not found."
  '500':
    $ref: ../../../components/responses/500.yaml