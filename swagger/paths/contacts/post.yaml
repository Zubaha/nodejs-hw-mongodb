tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact for the authenticated user.
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: "Contact's name"
            example: 'Tom Tomson'
          phoneNumber:
            type: string
            description: "Contact's phone number"
            example: '+12333435554'
          email:
            type: string
            description: "Contact's email address"
            example: 'tom123@mail.com'
          isFavourite:
            type: boolean
            description: "Is the contact a favorite?"
            example: true
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            description: "Type of contact"
            example: 'home'
          photo:
            type: string
            format: binary
responses:
  '201':
    description: Contact successfully created
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Contact successfully created!"
            data:
              type: object
              properties:
                name:
                  type: string
                phoneNumber:
                  type: string
                email:
                  type: string
                isFavourite:
                  type: boolean
                contactType:
                  type: string
  '400':
    description: Invalid input
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: "Invalid input data."
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml              