tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact for the authenticated user.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            nullable: false
            description: "Contact's name"
          phoneNumber:
            type: string
            nullable: false
            description: "Contact's phone number"
          email:
            type: string
            nullable: true
            description: "Contact's email address"
          isFavourite:
            type: boolean
            nullable: true
            description: "Is the contact a favorite?"
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            nullable: true
            description: "Type of contact"
          photo:
            type: string
            format: binary
            nullable: true
responses:
  '201':
    description: Contact successfully created
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Contact successfully created!"
            data:
              type: object
              properties:
                name:
                  type: string
                phoneNumber:
                  type: string
                email:
                  type: string
                isFavourite:
                  type: boolean
                contactType:
                  type: string
  '400':
    description: Invalid input
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: "Invalid input data."
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml              